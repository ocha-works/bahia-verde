<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahia Verde — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce,
     and the line the screenshot harness reads its verdict from. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script>
  // Collect page errors from the very first moment, so a headless
  // play-test can read them back out of the status line.
  window.__bvErrors = [];
  window.addEventListener('error', (event) => {
    window.__bvErrors.push(String(event.message || event.error || 'unknown error'));
  });
</script>
</head>
<body>
<canvas id="game" aria-label="Bahia Verde: explore the city on foot and by car, run missions, and outrun the police. WASD to move, E to enter a car, mouse to aim, click to fight."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
